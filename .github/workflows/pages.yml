# The hosted demo (https://neocarlos.github.io/ha-calm-tv/): the app in demo mode, with a made-up home.
# Built from the repo on each push to main, so it only has the project's own backgrounds, re-encoded
# smaller for the web (H.264 at CRF 28: about 60% smaller and plays everywhere). The TV app keeps
# the full-quality clips.
name: Demo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Shrink the background videos for the web
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          for f in src/videos/*.mp4; do
            ffmpeg -v error -y -i "$f" -an -c:v libx264 -preset slow -crf 28 -pix_fmt yuv420p -movflags +faststart "$f.web.mp4"
            mv "$f.web.mp4" "$f"
          done
          ls -l src/videos

      - name: Build the demo site
        run: npm run build:site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
